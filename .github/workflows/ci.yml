name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/safe-local-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/safe-local-files/go.mod
          cache-dependency-path: plugins/safe-local-files/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/safe-local-files
      - name: Check portable shell scripts
        run: sh -n ../../install.sh scripts/build.sh scripts/start.sh scripts/stop.sh scripts/rotate-token.sh
